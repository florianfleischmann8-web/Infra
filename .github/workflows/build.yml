name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projekt erzeugen
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'ZAPP_EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "de.zapp.remote"
              compileSdk = 34
              defaultConfig { applicationId = "de.zapp.remote"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          ZAPP_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ZAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR"/>
              <uses-feature android:name="android.hardware.consumerir" android:required="false"/>
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ZAPP_EOF
          mkdir -p app/src/main/java/de/zapp/remote
          cat > app/src/main/java/de/zapp/remote/MainActivity.kt <<'ZAPP_EOF'
          package de.zapp.remote

          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.ConsumerIrManager
          import android.os.Bundle
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private var ir: ConsumerIrManager? = null
              private var brand = "Samsung"
              private lateinit var status: TextView
              private val chips = LinkedHashMap<String, TextView>()
              private val BG = Color.parseColor("#0B0F1A")
              private val CARD = Color.parseColor("#1A2033")
              private val ACCENT = Color.parseColor("#FF2D55")
              private val brands = listOf("Samsung", "LG", "Sony", "Toshiba")
              private val keys = listOf("pow", "vup", "vdn", "mute", "cup", "cdn")

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              // NEC-Protokoll (Samsung, LG, Toshiba)
              private fun nec(hm: Int, hs: Int, a1: Int, a2: Int, c: Int): IntArray {
                  val l = ArrayList<Int>()
                  l.add(hm); l.add(hs)
                  val d = a1 or (a2 shl 8) or (c shl 16) or ((c.inv() and 0xFF) shl 24)
                  for (i in 0 until 32) { l.add(560); l.add(if (((d shr i) and 1) == 1) 1690 else 560) }
                  l.add(560); l.add(20000)
                  return l.toIntArray()
              }

              // Sony SIRC 12 Bit, 3x gesendet
              private fun sony(c: Int): IntArray {
                  val l = ArrayList<Int>()
                  val d = c or (1 shl 7)
                  repeat(3) {
                      val s = l.size
                      l.add(2400); l.add(600)
                      for (i in 0 until 12) { l.add(if (((d shr i) and 1) == 1) 1200 else 600); l.add(600) }
                      var sum = 0
                      for (k in s until l.size) sum += l[k]
                      l[l.size - 1] = l[l.size - 1] + 45000 - sum
                  }
                  return l.toIntArray()
              }

              private fun code(b: String, k: String): IntArray? {
                  val i = keys.indexOf(k)
                  return when (b) {
                      "Samsung" -> nec(4500, 4500, 7, 7, intArrayOf(0x02, 0x07, 0x0B, 0x0F, 0x12, 0x10)[i])
                      "LG" -> nec(9000, 4500, 0x04, 0xFB, intArrayOf(0x08, 0x02, 0x03, 0x09, 0x00, 0x01)[i])
                      "Sony" -> sony(intArrayOf(21, 18, 19, 20, 16, 17)[i])
                      "Toshiba" -> if (k == "pow") nec(9000, 4500, 0x40, 0xBF, 0x12) else null
                      else -> null
                  }
              }

              private fun send(k: String) {
                  val m = ir
                  if (m == null || !m.hasIrEmitter()) { status.text = "Dieses Handy hat keinen Infrarot-Sender"; return }
                  val p = code(brand, k) ?: run { status.text = "Taste für $brand nicht verfügbar"; return }
                  m.transmit(if (brand == "Sony") 40000 else 38000, p)
                  status.text = "$brand · gesendet"
              }

              private fun powerAll() {
                  val m = ir
                  if (m == null || !m.hasIrEmitter()) { status.text = "Dieses Handy hat keinen Infrarot-Sender"; return }
                  Thread {
                      for (b in brands) {
                          runOnUiThread { status.text = "Schalte aus: $b …" }
                          val p = code(b, "pow") ?: continue
                          repeat(2) {
                              m.transmit(if (b == "Sony") 40000 else 38000, p)
                              Thread.sleep(p.sum() / 1000L + 250)
                          }
                      }
                      runOnUiThread { status.text = "Fertig – alle Marken gesendet" }
                  }.start()
              }


              private class Cand(val label: String, val carrier: Int, val p: IntArray)

              private val cands: List<Cand> by lazy {
                  val l = ArrayList<Cand>()
                  brands.forEach { b -> code(b, "pow")?.let { l.add(Cand("$b TV", if (b == "Sony") 40000 else 38000, it)) } }
                  val adr = intArrayOf(0x00, 0x01, 0x02, 0x04, 0x07, 0x08, 0x10, 0x18, 0x20, 0x30, 0x32, 0x40, 0x4F, 0x55, 0x80, 0x86)
                  val cmd = intArrayOf(0x00, 0x01, 0x02, 0x03, 0x08, 0x0A, 0x0C, 0x12, 0x15, 0x17, 0x18, 0x1C, 0x40, 0x45, 0x46, 0x4F, 0x51, 0x5F)
                  for (a in adr) for (c in cmd)
                      l.add(Cand("NEC Adresse %02X · Befehl %02X".format(a, c), 38000, nec(9000, 4500, a, a.inv() and 0xFF, c)))
                  l
              }
              @Volatile private var scanning = false
              private var idx = 0
              private lateinit var scanPanel: LinearLayout
              private lateinit var stepRow: LinearLayout
              private lateinit var savedBox: LinearLayout
              private val prefs by lazy { getSharedPreferences("zapp", MODE_PRIVATE) }

              private fun startScan() {
                  val m = ir
                  if (m == null || !m.hasIrEmitter()) { status.text = "Dieses Handy hat keinen Infrarot-Sender"; return }
                  if (scanning) return
                  scanPanel.visibility = View.VISIBLE; stepRow.visibility = View.GONE
                  scanning = true
                  Thread {
                      while (scanning && idx < cands.size) {
                          val c = cands[idx]
                          val n = idx + 1
                          runOnUiThread { status.text = "Suche $n/${cands.size}\n${c.label}" }
                          m.transmit(c.carrier, c.p)
                          Thread.sleep(c.p.sum() / 1000L + 300)
                          if (scanning) idx++
                      }
                      if (scanning) {
                          scanning = false; idx = cands.size - 1
                          runOnUiThread { status.text = "Durchlauf beendet – nichts gefunden"; stepRow.visibility = View.GONE }
                      }
                  }.start()
              }

              private fun stopScan() {
                  if (!scanning) return
                  scanning = false
                  stepRow.visibility = View.VISIBLE
                  status.text = "Pausiert bei ${cands[idx].label}\nMit ◀ zurückgehen, bis das Gerät reagiert, dann ✔"
              }

              private fun step(d: Int) {
                  val m = ir ?: return
                  idx = (idx + d).coerceIn(0, cands.size - 1)
                  val c = cands[idx]
                  m.transmit(c.carrier, c.p)
                  status.text = "Gesendet ${idx + 1}/${cands.size}\n${c.label}"
              }

              private fun sendTwice(car: Int, p: IntArray) {
                  val m = ir
                  if (m == null || !m.hasIrEmitter()) { status.text = "Dieses Handy hat keinen Infrarot-Sender"; return }
                  Thread { repeat(2) { m.transmit(car, p); Thread.sleep(p.sum() / 1000L + 300) } }.start()
                  status.text = "Gesendet"
              }

              private fun saveCurrent() {
                  val c = cands[idx]
                  val n = prefs.getString("saved", "")!!.lines().count { it.isNotBlank() } + 1
                  val et = android.widget.EditText(this).apply { setText("Gerät $n") }
                  android.app.AlertDialog.Builder(this).setTitle("Name für diesen Code").setView(et)
                      .setPositiveButton("Speichern") { _, _ ->
                          val name = et.text.toString().replace("|", " ").replace("\n", " ")
                          val line = name + "|" + c.carrier + "|" + c.p.joinToString(",")
                          prefs.edit().putString("saved", prefs.getString("saved", "")!! + line + "\n").apply()
                          scanPanel.visibility = View.GONE
                          refreshSaved(); status.text = "Gespeichert: $name"
                      }.setNegativeButton("Abbrechen", null).show()
              }

              private fun refreshSaved() {
                  savedBox.removeAllViews()
                  val lines = prefs.getString("saved", "")!!.lines().filter { it.isNotBlank() }
                  if (lines.isEmpty()) return
                  savedBox.addView(TextView(this).apply {
                      text = "MEINE GERÄTE · lang drücken = löschen"; textSize = 12f; letterSpacing = 0.1f
                      setTextColor(Color.parseColor("#8A93B2")); gravity = Gravity.CENTER; setPadding(0, dp(24), 0, dp(6))
                  })
                  lines.forEach { ln ->
                      val s = ln.split("|")
                      val car = s[1].toInt()
                      val p = s[2].split(",").map { it.toInt() }.toIntArray()
                      savedBox.addView(row(tile("⏻  " + s[0], 15f, CARD, 56) { sendTwice(car, p) }.apply {
                          setOnLongClickListener {
                              prefs.edit().putString("saved", lines.filter { it != ln }.joinToString("\n") + "\n").apply()
                              refreshSaved(); true
                          }
                      }))
                  }
              }

              private fun refresh() {
                  chips.forEach { (n, t) -> (t.background as GradientDrawable).setColor(if (n == brand) ACCENT else CARD) }
              }

              private fun tile(label: String, size: Float, color: Int, h: Int, onTap: () -> Unit) = TextView(this).apply {
                  text = label; textSize = size; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                  gravity = Gravity.CENTER
                  background = GradientDrawable().apply { setColor(color); cornerRadius = dp(h / 2).toFloat() * 0.6f }
                  layoutParams = LinearLayout.LayoutParams(0, dp(h), 1f).apply { setMargins(dp(6), dp(6), dp(6), dp(6)) }
                  setOnClickListener { it.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY); onTap() }
              }

              private fun row(vararg v: View) = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  v.forEach { addView(it) }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  ir = getSystemService(Context.CONSUMER_IR_SERVICE) as? ConsumerIrManager
                  window.statusBarColor = BG; window.navigationBarColor = BG
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL
                      setBackgroundColor(BG); setPadding(dp(18), dp(36), dp(18), dp(24))
                  }
                  root.addView(TextView(this).apply {
                      text = "ZAPP"; textSize = 36f; letterSpacing = 0.3f; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE); gravity = Gravity.CENTER
                  })
                  root.addView(TextView(this).apply {
                      text = "Universal-Fernbedienung"; textSize = 14f; setTextColor(Color.parseColor("#8A93B2")); gravity = Gravity.CENTER
                  })
                  val big = TextView(this).apply {
                      text = "⏻"; textSize = 72f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(ACCENT, Color.parseColor("#5B2BFF"))).apply { shape = GradientDrawable.OVAL }
                      layoutParams = LinearLayout.LayoutParams(dp(170), dp(170)).apply { topMargin = dp(32); bottomMargin = dp(10) }
                      setOnClickListener { it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS); powerAll() }
                  }
                  root.addView(big)
                  root.addView(TextView(this).apply {
                      text = "ALLE TVs AUS"; textSize = 13f; letterSpacing = 0.2f; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#8A93B2")); gravity = Gravity.CENTER
                  })
                  val chipRow = row()
                  brands.forEach { n -> val t = tile(n, 13f, CARD, 40) { brand = n; refresh() }; chips[n] = t; chipRow.addView(t) }
                  chipRow.layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(28) }
                  root.addView(chipRow)
                  fun k(l: String, key: String) = tile(l, 20f, CARD, 64) { send(key) }
                  root.addView(row(k("VOL −", "vdn"), k("🔇", "mute"), k("VOL +", "vup")))
                  root.addView(row(k("PRG −", "cdn"), tile("EIN/AUS", 16f, ACCENT, 64) { send("pow") }, k("PRG +", "cup")))
                  root.addView(row(tile("🔍  GERÄT SUCHEN (Beamer, TV …)", 15f, Color.parseColor("#5B2BFF"), 56) { idx = 0; startScan() }))
                  stepRow = row(
                      tile("◀", 22f, CARD, 56) { step(-1) },
                      tile("▶", 22f, CARD, 56) { step(1) },
                      tile("✔ SPEICHERN", 14f, ACCENT, 56) { saveCurrent() }
                  ).apply { visibility = View.GONE }
                  scanPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; visibility = View.GONE
                      addView(row(tile("STOPP – es hat reagiert!", 15f, ACCENT, 56) { stopScan() }))
                      addView(stepRow)
                  }
                  root.addView(scanPanel)
                  status = TextView(this).apply {
                      textSize = 13f; setTextColor(Color.parseColor("#8A93B2")); gravity = Gravity.CENTER
                      text = if (ir?.hasIrEmitter() == true) "Bereit" else "Kein Infrarot-Sender gefunden"
                      setPadding(0, dp(20), 0, 0)
                  }
                  root.addView(status)
                  savedBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(savedBox)
                  setContentView(ScrollView(this).apply { isFillViewport = true; setBackgroundColor(BG); addView(root) })
                  refresh(); refreshSaved()
              }
          }
          ZAPP_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_bg.xml <<'ZAPP_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="linear" android:startX="0" android:startY="0" android:endX="108" android:endY="108"
                          android:startColor="#FF2D55" android:endColor="#5B2BFF"/>
                  </aapt:attr>
              </path>
          </vector>
          ZAPP_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'ZAPP_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M65.47,39.62 A20,20 0 1 1 42.53,39.62" android:strokeColor="#FFFFFF" android:strokeWidth="5.5" android:strokeLineCap="round"/>
              <path android:pathData="M54,33 L54,53" android:strokeColor="#FFFFFF" android:strokeWidth="5.5" android:strokeLineCap="round"/>
              <path android:pathData="M70,28 A22,22 0 0 1 80,38" android:strokeColor="#CCFFFFFF" android:strokeWidth="3" android:strokeLineCap="round"/>
              <path android:pathData="M72,20 A30,30 0 0 1 88,36" android:strokeColor="#66FFFFFF" android:strokeWidth="3" android:strokeLineCap="round"/>
          </vector>
          ZAPP_EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'ZAPP_EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          ZAPP_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'ZAPP_EOF'
          <resources><string name="app_name">Zapp</string></resources>
          ZAPP_EOF
          cat > build.gradle.kts <<'ZAPP_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ZAPP_EOF
          cat > gradle.properties <<'ZAPP_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          ZAPP_EOF
          cat > settings.gradle.kts <<'ZAPP_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Zapp"
          include(":app")
          ZAPP_EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zapp-APK
          path: app/build/outputs/apk/debug/*.apk

